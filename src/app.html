<!doctype html>
<html lang="es-PE" class="scroll-smooth">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>NovaLyne | Agencia Digital en Lima, Perú | Desarrollo Web & Marketing</title>
		<meta name="description" content="Agencia digital en Lima, Perú especializada en diseño y desarrollo de páginas web de alto rendimiento, tiendas virtuales con pasarelas locales (Yape, Plin), marketing digital y posicionamiento SEO." />
		
		<!-- Open Graph / Redes Sociales en Perú -->
		<meta property="og:type" content="website" />
		<meta property="og:locale" content="es_PE" />
		<meta property="og:site_name" content="NovaLyne Perú" />
		<meta property="og:title" content="NovaLyne | Agencia Digital en Lima, Perú" />
		<meta property="og:description" content="Diseño web moderno, e-commerce con pasarelas peruanas y estrategias de marketing digital de alto impacto." />
		<meta property="og:image" content="/favicon.svg" />

		<!-- Geolocalización para Lima, Perú -->
		<meta name="geo.region" content="PE-LIM" />
		<meta name="geo.placename" content="Lima, Perú" />
		<meta name="geo.position" content="-12.1215;-77.0298" />
		<meta name="ICBM" content="-12.1215, -77.0298" />

		<!-- Fuentes -->
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

		<!-- Schema.org Datos Estructurados para Negocio Local en Lima, Perú -->
		<script type="application/ld+json">
		{
			"@context": "https://schema.org",
			"@type": "ProfessionalService",
			"name": "NovaLyne Perú",
			"image": "https://novalyne.pe/favicon.svg",
			"url": "https://novalyne.pe",
			"telephone": "+51987654321",
			"priceRange": "S/.",
			"address": {
				"@type": "PostalAddress",
				"streetAddress": "Av. José Pardo 601",
				"addressLocality": "Miraflores",
				"addressRegion": "Lima",
				"postalCode": "15074",
				"addressCountry": "PE"
			},
			"geo": {
				"@type": "GeoCoordinates",
				"latitude": -12.1215,
				"longitude": -77.0298
			},
			"openingHoursSpecification": [
				{
					"@type": "OpeningHoursSpecification",
					"dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
					"opens": "08:30",
					"closes": "18:30"
				}
			],
			"sameAs": []
		}
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="font-['Plus_Jakarta_Sans',sans-serif] bg-slate-50 text-slate-800 antialiased selection:bg-blue-600 selection:text-white">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
